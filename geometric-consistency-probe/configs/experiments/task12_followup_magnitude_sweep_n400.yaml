# Task 12 follow-up #3: camera-rotation MAGNITUDE sweep at N=400.
# See experiments/task12_followup_magnitude_sweep.py's module docstring
# for the full rationale. Separate scene pool (base_seed=42, distinct
# from Task 12's own base_seed_real_motion=0/base_seed_static_control=1
# and from this follow-up chain's own N=100/N=200 scale checks) and its
# own output_dir/result_path -- does not touch state/task_12_result.json,
# that task's checkpoint, or experiments/temporal_consistency_followup_n100
# or _n200.

num_scenes: 400
base_seed: 42
train_fraction: 0.7
val_fraction: 0.1
thetas_deg: [0.0, 5.0, 10.0, 20.0, 30.0]
elevation_deg: 0.0
output_dir: experiments/temporal_magnitude_sweep_n400
result_path: experiments/temporal_magnitude_sweep_n400/result.json

resolution: 128
window_frames: 4
fps: 4.0

ridge_alpha_grid: [1.0, 10.0, 100.0]
shuffled_pairing_seed: 0

num_objects_min: 1
num_objects_max: 3

pretrained: true
checkpoint: facebook/vjepa2-vitl-fpc64-256
device: null
fallback_seed: 0

n_bootstrap: 2000
bootstrap_seeds: [0, 1, 2]
