# Task 9 config: appearance invariance controls.
#
# Reuses Task 7's exact scene-sampling convention (num_scenes=40,
# base_seed=0, 1-3 objects/scene, train_fraction=0.8) so this run's
# sampled scene set is identical to Task 7's, and its already-rendered
# original/transformed pairs under experiments/geometric_consistency/ can
# be reused unmodified for lighting_change, texture_change, and the four
# geometric transforms. Same real pretrained V-JEPA 2 ViT-L/16 encoder,
# same resolution/num_frames/fps as Task 7, for a like-for-like
# comparison; falls back to a seeded random-weight model (and honestly
# records encoder.pretrained: false) if Hugging Face Hub is unreachable.

num_scenes: 40
train_fraction: 0.8
base_seed: 0

num_objects_min: 1
num_objects_max: 3

reused_output_dir: experiments/geometric_consistency
null_transform_output_dir: experiments/appearance_invariance/null_transform
result_path: state/task_09_result.json

resolution: 128
num_frames: 4
fps: 4.0

pretrained: true
checkpoint: facebook/vjepa2-vitl-fpc64-256
device: null
fallback_seed: 0
