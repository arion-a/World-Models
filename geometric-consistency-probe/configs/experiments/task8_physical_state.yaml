# Task 8 config: physical-state accessibility.
#
# Reuses Tasks 6-7's exact scene-sampling convention (>=40 scenes,
# base_seed 0, 1-3 objects/scene) so the sampled scene set -- and hence
# the scene-level train/test split -- is identical to Tasks 6-7's.
# Reuses Task 7's already-rendered "original" side
# (experiments/geometric_consistency/camera_rotation/) when present,
# falling back to a fresh render otherwise. Same real pretrained
# V-JEPA 2 ViT-L/16 encoder as Tasks 6-7; falls back to a seeded
# random-weight model (and honestly records encoder.pretrained: false)
# if Hugging Face Hub is unreachable at run time.

num_scenes: 40
train_fraction: 0.8
base_seed: 0
result_path: state/task_08_result.json

reuse_render_dir: experiments/geometric_consistency/camera_rotation
own_render_dir: experiments/physical_state/original_renders
own_render_transform: camera_rotation

resolution: 128
num_frames: 4
fps: 4.0

ridge_alpha: 10.0
shuffled_label_seed: 0

num_objects_min: 1
num_objects_max: 3

pretrained: true
checkpoint: facebook/vjepa2-vitl-fpc64-256
device: null
fallback_seed: 0

alignment_tolerance: 1.0e-4
