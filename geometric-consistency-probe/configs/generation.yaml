# Task 2 config: controlled 3D scene generation.
#
#   python -m generation.generate --config configs/generation.yaml
#
# Deliberately ~10 scenes for validation, per the task brief ("not
# 1,000"). See generation/COORDINATE_SYSTEM.md for what every saved
# field means, and DESIGN.md for the research context this dataset
# format serves.

num_scenes: 10
base_seed: 0
output_dir: data/generation_v0
resolution: 128
num_frames: 8
fps: 12.0
num_objects_min: 1
num_objects_max: 3

# Depth is clamped to [depth_near, depth_far] before being decoded back
# to scene units (see generation/ground_truth.py); max_instances bounds
# how many distinct objects the segmentation encoding can represent
# (background is always 0, so this project's "1-3 objects" scenes need
# far fewer than the default headroom of 255).
depth_near: 0.05
depth_far: 30.0
max_instances: 255

object_motion:
  enabled: true
  linear_speed_range: [0.0, 0.4]        # scene-units/second
  angular_speed_deg_range: [0.0, 30.0]  # degrees/second, about world z

camera_motion:
  mode: static  # "static" | "orbit"
  orbit_deg_per_sec_range: [5.0, 20.0]  # only used when mode: orbit
