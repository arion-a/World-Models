<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<rect width="900" height="560" rx="14" fill="#0f172a"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<text x="450" y="30" fill="#f1f5f9" font-size="18" font-weight="700" text-anchor="middle">Can a linear map predict how a frozen V-JEPA 2 representation changes when the 3D scene changes?</text>
<rect x="20" y="54" width="520" height="84" rx="10" fill="#1e293b" stroke="#38bdf8"/>
<text x="34" y="76" fill="#38bdf8" font-size="13" font-weight="700">1. Scene S, rendered in Blender (3D state known exactly)</text>
<text x="34" y="96" fill="#cbd5e1" font-size="12.5">Video V of S  →  frozen V-JEPA 2 ViT-L/16 (weights never change)</text>
<text x="34" y="114" fill="#cbd5e1" font-size="12.5">→ representation Z: 1024 numbers per video (mean of the model's tokens)</text>
<rect x="20" y="152" width="520" height="84" rx="10" fill="#1e293b" stroke="#a78bfa"/>
<text x="34" y="174" fill="#a78bfa" font-size="13" font-weight="700">2. The same scene after one transform T (here: camera rotated by θ)</text>
<text x="34" y="194" fill="#cbd5e1" font-size="12.5">Video V′ of T(S)  →  same frozen model  →  representation Z′</text>
<text x="34" y="212" fill="#cbd5e1" font-size="12.5">Because the scene is synthetic, T is known exactly</text>
<rect x="20" y="250" width="520" height="100" rx="10" fill="#1e293b" stroke="#34d399"/>
<text x="34" y="272" fill="#34d399" font-size="13" font-weight="700">3. Test: is Z′ ≈ W·Z for one linear map W?</text>
<text x="34" y="292" fill="#cbd5e1" font-size="12.5">W is fitted by ridge regression on training scenes only.</text>
<text x="34" y="310" fill="#cbd5e1" font-size="12.5">Score = R² on held-out scenes (1 = perfect, 0 = as good as the mean).</text>
<text x="34" y="328" fill="#cbd5e1" font-size="12.5">Controls: "assume no change" (Z′ = Z) and shuffled scene pairs.</text>
<g stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" fill="none"><path d="M280 139 V150"/><path d="M280 237 V248"/></g>
<text x="725.0" y="62" fill="#f1f5f9" font-size="13" font-weight="700" text-anchor="middle">Result: R² of W vs. camera rotation θ</text>
<text x="725.0" y="80" fill="#94a3b8" font-size="11" text-anchor="middle">800 scenes, Task 12 follow-up (rotation-magnitude sweep)</text>
<line x1="600" y1="310" x2="850" y2="310" stroke="#334155"/>
<text x="592" y="314" fill="#94a3b8" font-size="11" text-anchor="end">0</text>
<line x1="600" y1="260.0" x2="850" y2="260.0" stroke="#334155"/>
<text x="592" y="264.0" fill="#94a3b8" font-size="11" text-anchor="end">0.25</text>
<line x1="600" y1="210.0" x2="850" y2="210.0" stroke="#334155"/>
<text x="592" y="214.0" fill="#94a3b8" font-size="11" text-anchor="end">0.5</text>
<line x1="600" y1="160.0" x2="850" y2="160.0" stroke="#334155"/>
<text x="592" y="164.0" fill="#94a3b8" font-size="11" text-anchor="end">0.75</text>
<line x1="600" y1="110" x2="850" y2="110" stroke="#334155"/>
<text x="592" y="114" fill="#94a3b8" font-size="11" text-anchor="end">1</text>
<text x="600.0" y="328" fill="#94a3b8" font-size="11" text-anchor="middle">0°</text>
<text x="641.6666666666666" y="328" fill="#94a3b8" font-size="11" text-anchor="middle">5°</text>
<text x="683.3333333333334" y="328" fill="#94a3b8" font-size="11" text-anchor="middle">10°</text>
<text x="766.6666666666666" y="328" fill="#94a3b8" font-size="11" text-anchor="middle">20°</text>
<text x="850.0" y="328" fill="#94a3b8" font-size="11" text-anchor="middle">30°</text>
<text x="725.0" y="346" fill="#94a3b8" font-size="11" text-anchor="middle">rotation θ between the two videos</text>
<polyline points="600.0,110.0 641.7,137.8 683.3,167.1 766.7,223.8 850.0,272.5" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6 4"/>
<circle cx="600.0" cy="110.0" r="3.5" fill="#fbbf24"/>
<circle cx="641.7" cy="137.8" r="3.5" fill="#fbbf24"/>
<circle cx="683.3" cy="167.1" r="3.5" fill="#fbbf24"/>
<circle cx="766.7" cy="223.8" r="3.5" fill="#fbbf24"/>
<circle cx="850.0" cy="272.5" r="3.5" fill="#fbbf24"/>
<polyline points="600.0,111.5 641.7,140.5 683.3,160.1 766.7,183.9 850.0,205.4" fill="none" stroke="#34d399" stroke-width="2.5" />
<circle cx="600.0" cy="111.5" r="3.5" fill="#34d399"/>
<circle cx="641.7" cy="140.5" r="3.5" fill="#34d399"/>
<circle cx="683.3" cy="160.1" r="3.5" fill="#34d399"/>
<circle cx="766.7" cy="183.9" r="3.5" fill="#34d399"/>
<circle cx="850.0" cy="205.4" r="3.5" fill="#34d399"/>
<text x="856.0" y="209.42" fill="#34d399" font-size="11.5" font-weight="700">0.52</text>
<text x="856.0" y="276.5" fill="#fbbf24" font-size="11.5" font-weight="700">0.19</text>
<text x="760.6666666666666" y="173.88" fill="#34d399" font-size="12" font-weight="700" text-anchor="end">learned map W</text>
<text x="772.6666666666666" y="245.82" fill="#fbbf24" font-size="12" font-weight="700">"assume no change"</text>
<text x="725.0" y="362" fill="#94a3b8" font-size="10.5" text-anchor="middle">Shuffled-pair control is below 0 at every θ (not drawn). W overtakes "no change" from 10°.</text>
<text x="450" y="398" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">Every task against its own controls (N = 40 scenes unless stated)</text>
<rect x="20" y="410" width="164" height="48" rx="8" fill="#7f1d1d" stroke="#f87171"/>
<text x="28" y="427" fill="#f1f5f9" font-size="12" font-weight="700">Task 6: <tspan font-weight="400" fill="#e2e8f0">camera rotation</tspan></text>
<text x="28" y="447" fill="#f87171" font-size="12" font-weight="700">R² −0.31 vs −0.11</text>
<rect x="192" y="410" width="164" height="48" rx="8" fill="#7f1d1d" stroke="#f87171"/>
<text x="200" y="427" fill="#f1f5f9" font-size="12" font-weight="700">Task 7: <tspan font-weight="400" fill="#e2e8f0">six transforms</tspan></text>
<text x="200" y="447" fill="#f87171" font-size="12" font-weight="700">beats control: 0 of 6</text>
<rect x="364" y="410" width="164" height="48" rx="8" fill="#064e3b" stroke="#34d399"/>
<text x="372" y="427" fill="#f1f5f9" font-size="12" font-weight="700">Task 7B: <tspan font-weight="400" fill="#e2e8f0">yaw only, 1024 train scenes</tspan></text>
<text x="372" y="447" fill="#34d399" font-size="12" font-weight="700">R² 0.56 vs 0.16*</text>
<rect x="536" y="410" width="164" height="48" rx="8" fill="#422006" stroke="#fbbf24"/>
<text x="544" y="427" fill="#f1f5f9" font-size="12" font-weight="700">Task 8: <tspan font-weight="400" fill="#e2e8f0">decode camera/object state</tspan></text>
<text x="544" y="447" fill="#fbbf24" font-size="12" font-weight="700">2 of 4 variables</text>
<rect x="708" y="410" width="164" height="48" rx="8" fill="#7f1d1d" stroke="#f87171"/>
<text x="716" y="427" fill="#f1f5f9" font-size="12" font-weight="700">Task 9: <tspan font-weight="400" fill="#e2e8f0">appearance vs geometry</tspan></text>
<text x="716" y="447" fill="#f87171" font-size="12" font-weight="700">no clean separation</text>
<rect x="20" y="466" width="164" height="48" rx="8" fill="#7f1d1d" stroke="#f87171"/>
<text x="28" y="483" fill="#f1f5f9" font-size="12" font-weight="700">Task 10: <tspan font-weight="400" fill="#e2e8f0">five baselines</tspan></text>
<text x="28" y="503" fill="#f87171" font-size="12" font-weight="700">below 4 of 5</text>
<rect x="192" y="466" width="164" height="48" rx="8" fill="#7f1d1d" stroke="#f87171"/>
<text x="200" y="483" fill="#f1f5f9" font-size="12" font-weight="700">Task 11: <tspan font-weight="400" fill="#e2e8f0">scale to 100 scenes</tspan></text>
<text x="200" y="503" fill="#f87171" font-size="12" font-weight="700">R² stays below 0</text>
<rect x="364" y="466" width="164" height="48" rx="8" fill="#7f1d1d" stroke="#f87171"/>
<text x="372" y="483" fill="#f1f5f9" font-size="12" font-weight="700">Task 12: <tspan font-weight="400" fill="#e2e8f0">motion between windows</tspan></text>
<text x="372" y="503" fill="#f87171" font-size="12" font-weight="700">below static clip</text>
<rect x="536" y="466" width="164" height="48" rx="8" fill="#7f1d1d" stroke="#f87171"/>
<text x="544" y="483" fill="#f1f5f9" font-size="12" font-weight="700">Task 13: <tspan font-weight="400" fill="#e2e8f0">object through occlusion</tspan></text>
<text x="544" y="503" fill="#f87171" font-size="12" font-weight="700">below control</text>
<rect x="708" y="466" width="164" height="48" rx="8" fill="#334155" stroke="#94a3b8"/>
<text x="716" y="483" fill="#f1f5f9" font-size="12" font-weight="700">Task 14: <tspan font-weight="400" fill="#e2e8f0">counterfactual edits</tspan></text>
<text x="716" y="503" fill="#94a3b8" font-size="12" font-weight="700">invalidated by norm check</text>
<text x="450" y="534" fill="#94a3b8" font-size="11" text-anchor="middle">Red: negative. Green: positive. Amber: mixed. Grey: invalid. * Task 7B: learning curve had not levelled off at 1024 scenes.</text>
<text x="450" y="550" fill="#94a3b8" font-size="11" text-anchor="middle">Linear maps and linear probes only: a negative result means not linearly predictable, not absent.</text>
</svg>