<text x="450" y="30" fill="#f1f5f9" font-size="18" font-weight="700" text-anchor="middle">Does a frozen V-JEPA 2 representation change predictably when the 3D scene changes?</text>
<text x="450" y="54" fill="#cbd5e1" font-size="12" text-anchor="middle">Render scene S and its transformed version T(S) → frozen model gives representations Z and Z′ → fit one linear map W on training scenes → test Z′ ≈ W·Z on unseen scenes.</text>
<text x="450" y="78" fill="#e2e8f0" font-size="13.5" font-weight="700" text-anchor="middle">Every result against the benchmark it had to beat (R² on unseen scenes; 1 = perfect, 0 = predicting the average)</text>
<text x="450" y="97" fill="#94a3b8" font-size="12" text-anchor="middle">Bar = gap between result and benchmark (the best control for that test). "No change" means assuming Z′ = Z.</text>
